# `buf generate proto` from the repository root; the flake's `proto-generated` check fails when
# the committed code differs from what these local plugins produce.
version: v2
plugins:
  - local: protoc-gen-go
    out: internal/gen
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: internal/gen
    opt: paths=source_relative
